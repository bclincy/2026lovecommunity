      >
        <a href="#home" class="flex items-center gap-3">
          <img
            id="navLogo"
            src="/img/logo.png"
            alt="Love Community Garden Logo"
            class="h-12 w-12 shrink-0 transition-all duration-300"
          />
          <div class="leading-tight">
            <div class="text-lg font-semibold tracking-wide">
              Love Community Garden
            </div>
            <div class="text-xs text-white/70">Live • Grow • Connect</div>
          </div>
        </a>

        <button
          id="mobileMenuBtn"
          class="md:hidden rounded-lg border border-white/20 px-3 py-2 text-sm hover:bg-white/10"
          aria-expanded="false"
          aria-controls="mobileMenu"
        >
          Menu
        </button>

        <ul class="hidden md:flex items-center gap-6 text-sm">
          <li>
            <a
              class="navlink hover:text-royal-gold"

              title="The Giving Table"

              >Giving Table</a

          </li>
          <li>
            <a
              class="navlink hover:text-royal-gold"
              title="How you can Help"

              >Help</a

      <!-- Mobile menu -->

    <!-- PAGE -->
    <main class="pt-24">
      <!-- VOLUNTEER -->

    <section>
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <h1>Love Community Garden - Volunteer</h1>
        <form id="volunteer" method="post">
          <div class="space-y-6">
            <div>
              <label
                for="title"
                class="text-xs xs:text-sm font-medium  mb-1"
                >Job Title<!-- -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="17"
                  height="17"
                  color="#9CA3AF"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-circle-alert inline-block"
                >
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" x2="12" y1="8" y2="12"></line>
                  <line x1="12" x2="12.01" y1="16" y2="16"></line>
                </svg> </label
              ><input
                type="text"
                id="title"
                class="h-12.5 rounded-[5px] text-xs xs:text-sm border border-[#D1D5DB] w-full px-2"
                name="title"
                value=""
              />
            </div>
            <div class="grid sm:grid-cols-2 grid-cols-1 gap-6">
              <div>
                <label
                  for="category"
                  class="text-xs xs:text-sm font-medium text-gray-700 mb-1"
                  >Category</label
                ><select
                  name="category"
                  id="category"
                  class="h-12.5 rounded-[5px] text-xs xs:text-sm border border-[#D1D5DB] w-full px-2"
                >
                  <option value="" selected="">Select</option>
                  <option value="HR">HR</option>
                  <option value="programming">Programming</option>
                </select>
              </div>
              <div>
                <label
                  for="subcategory"
                  class="text-xs xs:text-sm font-medium text-gray-700 mb-1"
                  >Subcategory</label
                ><select
                  name="subcategory"
                  id="subcategory"
                  class="h-12.5 rounded-[5px] text-xs xs:text-sm border border-[#D1D5DB] w-full px-2"
                >
                  <option value="" selected="">Select</option>
                  <option value="HR-1">HR-1</option>
                  <option value="programming-1">Programming-1</option>
                </select>
              </div>
            </div>
            <div class="grid sm:grid-cols-2 grid-cols-1 gap-6">
              <div>
                <label
                  for="country"
                  class="text-xs xs:text-sm font-medium text-gray-700 mb-1"
                  >Country <span class="font-light">(Optional)</span></label
                ><select
                  name="country"
                  id="country"
                  class="h-12.5 rounded-[5px] text-xs xs:text-sm border border-[#D1D5DB] w-full px-2"
                >
                  <option value="" selected="">Select</option>
                  <option value="syria">Syria</option>
                  <option value="turkey">Turkey</option>
                </select>
              </div>
              <div>
                <label
                  for="language"
                  class="text-xs xs:text-sm font-medium text-gray-700 mb-1"
                  >Language</label
                >
                <div
                  class="flex flex-wrap items-center border rounded-md xs:p-2 bg-white"
                >
                  <span
                    class="bg-[#D9F99D] text-[#4D7C0F] px-1 py-0 xs:px-2 xs:py-1 rounded m-1 text-xs xs:text-sm flex items-center"
                    >Arabic<button
                      class="ml-1 text-[#4D7C0F] focus:outline-none"
                      type="button"
                    >
                      ×
                    </button></span
                  ><input
                    type="text"
                    placeholder="Add language"
                    class="grow outline-none py-2 w-2/3 text-sm xs:ml-2"
                    value=""
                  />
                </div>
              </div>
            </div>
            <input type="hidden" name="token" id="token" value="" />
          </div>
          <div class="mt-8 pt-6 border-t border-gray-200 flex justify-end">
            <button
              type="submit"
              class="sm:w-21.5 w-full h-12.5 text-xs sm:text-base bg-[--hunter-green] rounded-[5px] p-[13px_25px] gap-2.5 text-white"
            >
              Next
            </button>
          </div>
        </form>
      </div>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        debugger;
        fetch("/api/token", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((data) => {
            console.log("Token fetched:", data);
            if (data.token) {
              document.getElementById("token").value = data.token;
            }
          })
          .catch((error) => {
            console.error("Error fetching token:", error);
          });
      });
    </script>
  </body>
</html>
